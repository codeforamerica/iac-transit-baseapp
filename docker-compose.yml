services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file: .env.local
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-todoapp_user}
      - DB_PASSWORD=${DB_PASSWORD:-todoapp_password}
    depends_on:
      - db
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env.local
    depends_on:
      - backend

  db:
    image: postgres:15
    env_file: .env.local
    environment:
      - POSTGRES_DB=todoapp
      - POSTGRES_USER=${DB_USER:-todoapp_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-todoapp_password}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
